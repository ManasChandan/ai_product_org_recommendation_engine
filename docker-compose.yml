version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - neo4j

  batch_engine:
    build:
      context: .
      dockerfile: batch_engine/Dockerfile
    depends_on:
      - postgres
      - neo4j
    volumes:
      - ./data:/app/data

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: reco_user
      POSTGRES_PASSWORD: reco_pass
      POSTGRES_DB: reco_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5.21
    restart: always
    environment:
      NEO4J_AUTH: neo4j/testpass
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
