[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for recommendation engine"
authors = ["Rohit Kamble", "Manas Chandan Behera"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = "^0.30"
pandas = "^2.2"
